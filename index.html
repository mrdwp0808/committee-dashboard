<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enterprise Procurement Dashboard</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <!-- ChartJS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- TOPBAR -->
        <div class="topbar">

            <div>
                <h1>Procurement Monitoring Dashboard</h1>
                <p>Enterprise Operational Monitoring System</p>
            </div>

            <div class="topbar-right">

                <input type="text" id="searchInput" placeholder="Search anything...">
                <select id="monthFilter">
                    <option value="">All Month</option>
                </select>
                
                <select id="yearFilter">
                    <option value="">All Year</option>
                </select>

                <button id="darkModeBtn">
                    🌙 Dark Mode
                </button>

            </div>

        </div>

        <!-- KPI CARDS -->
        <div class="cards">

            <div class="card">
                <h3>Total Data</h3>
                <h2 id="totalData">0</h2>
            </div>

            <div class="card">
                <h3>OPEN</h3>
                <h2 id="openCount">0</h2>
            </div>

            <div class="card">
                <h3>DONE</h3>
                <h2 id="doneCount">0</h2>
            </div>

            <div class="card">
                <h3>PROGRESS</h3>
                <h2 id="progressCount">0</h2>
            </div>

        </div>

        <!-- CHART -->
        <div class="chart-section">

            <div class="chart-card">

                <div class="chart-title">
                    Procurement Status Summary
                </div>

                <canvas id="statusChart"></canvas>

            </div>

        </div>

        <!-- TABLE -->
        <div class="table-section">

            <div class="table-header">

                <h2>Procurement Monitoring Table</h2>

                <div class="table-info">
                    Showing all procurement data
                </div>

            </div>

            <div class="table-container">

                <table id="tableData">

                    <thead></thead>

                    <tbody></tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- DETAIL MODAL -->
    <div class="modal" id="detailModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Detail Information</h2>

                <span class="close-btn" id="closeModal">
                    &times;
                </span>

            </div>

            <div class="modal-body" id="modalBody"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
